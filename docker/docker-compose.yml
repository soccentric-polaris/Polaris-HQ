# Polaris-HQ — full deployment stack.
#
# Stateful services (postgres, minio, redis, keycloak) are also declared here
# so a single `docker compose up` brings up the whole HQ. Production requires
# secrets to be supplied via the environment (see app/config.py — the services
# fail closed unless POLARISHQ_ENV=production and real secrets are set).
#
# Usage:  docker compose -f docker/docker-compose.yml --env-file .env up -d
name: polarishq

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POLARISHQ_DB_USER:-polarishq}
      POSTGRES_PASSWORD: ${POLARISHQ_DB_PASSWORD:-polarishq}
      POSTGRES_DB: ${POLARISHQ_DB_NAME:-polarishq}
    volumes:
      - polarishq-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${POLARISHQ_S3_ACCESS_KEY:-polarishq}
      MINIO_ROOT_PASSWORD: ${POLARISHQ_S3_SECRET_KEY:-polarishq-dev-secret}
    volumes:
      - polarishq-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment: &api-env
      POLARISHQ_ENV: ${POLARISHQ_ENV:-production}
      POLARISHQ_DATABASE_URL: postgresql+asyncpg://${ACADIAQ_DB_USER:-polarishq}:${ACADIAQ_DB_PASSWORD:-polarishq}@postgres:5432/${ACADIAQ_DB_NAME:-polarishq}
      POLARISHQ_REDIS_URL: redis://redis:6379/0
      POLARISHQ_S3_ENDPOINT_URL: http://minio:9000
      POLARISHQ_S3_ACCESS_KEY: ${POLARISHQ_S3_ACCESS_KEY:-polarishq}
      POLARISHQ_S3_SECRET_KEY: ${POLARISHQ_S3_SECRET_KEY:-polarishq-dev-secret}
      POLARISHQ_S3_BUCKET: ${POLARISHQ_S3_BUCKET:-polarishq}
      POLARISHQ_OIDC_ISSUER: ${POLARISHQ_OIDC_ISSUER:?set POLARISHQ_OIDC_ISSUER}
      POLARISHQ_OIDC_CLIENT_ID: ${POLARISHQ_OIDC_CLIENT_ID:-polarishq-api}
      POLARISHQ_OIDC_CLIENT_SECRET: ${POLARISHQ_OIDC_CLIENT_SECRET:?set POLARISHQ_OIDC_CLIENT_SECRET}
      POLARISHQ_SESSION_SECRET_KEY: ${POLARISHQ_SESSION_SECRET_KEY:?set POLARISHQ_SESSION_SECRET_KEY}
      POLARISHQ_CORS_ALLOW_ORIGINS: ${POLARISHQ_CORS_ALLOW_ORIGINS:-http://localhost:8080}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${POLARISHQ_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: python -m gateway.server
    environment: *api-env
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${POLARISHQ_GATEWAY_PORT:-50051}:50051"

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    depends_on:
      - api
    ports:
      - "${POLARISHQ_WEB_PORT:-8080}:80"

volumes:
  polarishq-pg-data:
  polarishq-minio-data:
